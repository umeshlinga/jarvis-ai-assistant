<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS v4 - Live HUD</title>
<style>
  :root { --accent:#38e1ff; --bg:#0a0e14; --panel:#121826; --line:#1f2a3d;
          --text:#e8f1f8; --dim:#8fa3b8; --ok:#3ddc84; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px;
           border-bottom:1px solid var(--line); }
  .ring { width:26px; height:26px; border-radius:50%;
          border:3px solid var(--accent); box-shadow:0 0 14px var(--accent);
          animation:pulse 2.2s ease-in-out infinite; flex:none; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  h1 { font-size:20px; margin:0; letter-spacing:.14em; }
  h1 small { display:block; font-size:11px; color:var(--dim);
             letter-spacing:.08em; font-weight:400; }
  #state { margin-left:auto; font-size:15px; font-weight:600;
           padding:6px 14px; border:1px solid var(--line);
           border-radius:999px; background:var(--panel); }
  #state.listening { color:var(--ok); border-color:var(--ok); }
  #state.thinking  { color:#ffd166; border-color:#ffd166; }
  #state.speaking  { color:var(--accent); border-color:var(--accent); }
  #state.working   { color:#c792ff; border-color:#c792ff; }
  #state.error     { color:var(--err); border-color:var(--err); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 20px; }
  @media (max-width:760px){ main{grid-template-columns:1fr;} }
  section { background:var(--panel); border:1px solid var(--line);
            border-radius:12px; padding:12px 16px; min-height:180px; }
  section h2 { font-size:12px; letter-spacing:.16em; color:var(--dim);
               margin:2px 0 10px; text-transform:uppercase; }
  .msg { margin:0 0 10px; line-height:1.45; font-size:15px; }
  .msg .who { font-weight:700; margin-right:6px; }
  .msg.you .who { color:var(--ok); }
  .msg.jarvis .who { color:var(--accent); }
  .feed { list-style:none; margin:0; padding:0; font-size:13.5px; }
  .feed li { padding:6px 0; border-bottom:1px dashed var(--line); line-height:1.4; }
  .feed li:last-child { border-bottom:none; }
  .feed .ts { color:var(--dim); margin-right:8px; font-variant-numeric:tabular-nums; }
  .feed .kind { font-weight:700; margin-right:6px; text-transform:uppercase;
                font-size:11px; letter-spacing:.08em; }
  .kind.action { color:#c792ff; } .kind.task { color:#ffd166; }
  .kind.error  { color:var(--err); } .kind.state { color:var(--dim); }
  #conn { padding:0 20px 14px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="ring"></div>
  <h1>JARVIS v4<small id="subtitle">Live HUD</small></h1>
  <div id="state" class="idle">IDLE</div>
</header>
<main>
  <section>
    <h2>Conversation</h2>
    <div id="convo"><p class="msg"><span class="who">JARVIS</span>Waiting for Jarvis to start&hellip;</p></div>
  </section>
  <section>
    <h2>Activity &amp; Tasks</h2>
    <ul class="feed" id="feed"></ul>
  </section>
</main>
<div id="conn">Connecting&hellip;</div>
<script>
(function () {
  var stateEl = document.getElementById('state');
  var convoEl = document.getElementById('convo');
  var feedEl  = document.getElementById('feed');
  var connEl  = document.getElementById('conn');
  var subtitle = document.getElementById('subtitle');
  var started = false;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function addMsg(who, cls, text) {
    if (!started) { convoEl.innerHTML = ''; started = true; }
    var p = document.createElement('p');
    p.className = 'msg ' + cls;
    p.innerHTML = '<span class="who">' + esc(who) + '</span>' + esc(text);
    convoEl.appendChild(p);
    while (convoEl.children.length > 30) convoEl.removeChild(convoEl.firstChild);
    convoEl.scrollTop = convoEl.scrollHeight;
  }
  function addFeed(ev) {
    var li = document.createElement('li');
    var ts = '';
    try { ts = new Date(ev.ts * 1000).toLocaleTimeString(); } catch (e) {}
    li.innerHTML = '<span class="ts">' + esc(ts) + '</span>' +
                   '<span class="kind ' + esc(ev.kind) + '">' + esc(ev.kind) + '</span>' +
                   esc(ev.text);
    feedEl.insertBefore(li, feedEl.firstChild);
    while (feedEl.children.length > 60) feedEl.removeChild(feedEl.lastChild);
  }
  function onEvent(ev) {
    if (ev.kind === 'hello') {
      subtitle.textContent = 'Live HUD - ' + (ev.text || '');
      return;
    }
    if (ev.kind === 'state') {
      var s = (ev.text || 'idle').toLowerCase();
      stateEl.textContent = s.toUpperCase();
      stateEl.className = s;
      return;
    }
    if (ev.kind === 'heard')  { addMsg('YOU', 'you', ev.text); addFeed(ev); return; }
    if (ev.kind === 'reply')  { addMsg('JARVIS', 'jarvis', ev.text); addFeed(ev); return; }
    addFeed(ev);
  }
  function connect() {
    var es = new EventSource('/events');
    es.onopen = function () { connEl.textContent = 'Live - connected to Jarvis on this Mac (localhost only).'; };
    es.onmessage = function (m) { try { onEvent(JSON.parse(m.data)); } catch (e) {} };
    es.onerror = function () { connEl.textContent = 'Connection lost - retrying automatically…'; };
  }
  connect();
})();
</script>
</body>
</html>
